name: tests

on:
  # No `push` trigger: publish.yml calls this workflow on main and on tags, so
  # one would run the suite twice per merge.
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Seven of the runner's safety properties only execute against a real
      # daemon, and tests/conftest.py skips them when there is none. A hosted
      # runner has Docker, so a skip here means something is broken rather than
      # absent -- this turns it into a failure. readme.md promises this.
      REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4

      # No actions/setup-python and no pip install, deliberately. Every make
      # target runs inside the dev image, so CI exercises the same interpreter
      # and the same dependency set a developer has -- and the workflow cannot
      # drift away from what `make test` does locally.
      - run: make test

      # Smoke test for the catalogue command, and a check that manifest
      # discovery still finds every scope from a clean checkout.
      - run: make images-list

  # The pipeline no developer machine could run, until vcflib was pinned. It
  # now runs anywhere, including Apple Silicon -- but this stays, because a
  # hosted amd64 runner is the closest thing to the production host and because
  # exit status alone does not prove Snippy called anything.
  #
  # Worth remembering why this job used to live in its own workflow: while
  # vcflib was unpinned it resolved to an AVX-512 build, and hosted runners are
  # a mix of Intel and AMD, so it passed or SIGILLed depending on which machine
  # picked it up. A test decided by hardware lottery is worse than one that
  # fails honestly.
  snippy-fasta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only this pipeline's images. The full set is ~9 GB against a runner's
      # ~14 GB of disk, and ont-lsdv is verifiable on any developer machine.
      - run: make images-pull SCOPE=shared

      - run: make fixtures

      - name: Run snippy-fasta end to end and check it found the planted variants
        run: |
          set -o pipefail
          make smoke PIPELINE=snippy-fasta INPUT=fixtures/query.fasta | tee smoke.log

          # Exit status alone is not enough. Snippy can complete having called
          # nothing -- a wrong reference or an empty alignment both look like
          # success -- so assert the count. make fixtures plants exactly three
          # substitutions and prints them.
          found=$(sed -n 's/^ *variant_count *\([0-9]*\)$/\1/p' smoke.log)
          if [ "$found" != "3" ]; then
            echo "::error::expected the 3 planted variants, got '${found:-none}'"
            exit 1
          fi

      # Snippy writes the real error to work/snippy/snps.log and prints only
      # "Error running command, check <path>" to stdout. Without this the run
      # log names a file nobody can read -- which is how the AVX-512 crash
      # stayed undiagnosed across two CI failures.
      - name: Collect the logs the failure points at
        if: failure()
        run: |
          echo "=== snippy's own log ==="
          find runs -name 'snps.log' -exec sh -c 'echo "--- {}"; cat {}' \; || true
          echo "=== per-stage logs ==="
          find runs -path '*/logs/*' -name '*.log' \
            -exec sh -c 'echo "--- {}"; tail -50 {}' \; || true

      - name: Upload the run directory
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snippy-fasta-failure
          path: |
            runs/**/logs/**
            runs/**/work/snippy/snps.log
            smoke.log
          retention-days: 14
          if-no-files-found: warn

  production-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The default build target must not carry test dependencies
        run: |
          docker build -t dharini-runtime-check .
          # `docker build` with no --target builds the *last* stage in the
          # Dockerfile. If a stage is ever appended after `runtime`, or if the
          # compose services lose their explicit target, every deployed host
          # silently gains pytest and its transitive dependencies.
          if docker run --rm dharini-runtime-check python -c "import pytest"; then
            echo "::error::pytest is importable in the production image"
            exit 1
          fi
