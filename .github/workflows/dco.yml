name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    # Bots cannot sign off.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Every commit has a Signed-off-by line
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git show -s --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::$sha is not signed off: $(git show -s --format=%s "$sha")"
              missing=1
            fi
          done
          [ "$missing" = 0 ] || { echo "Add a sign-off with: git commit -s  (see CONTRIBUTING.md)"; exit 1; }
