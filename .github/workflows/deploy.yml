# Deploys to the EC2 host through a SELF-HOSTED runner installed on that host.
#
# Why a self-hosted runner rather than SSH from a hosted one: the runner polls
# GitHub outbound, so port 22 need not be open to the internet at all and no
# long-lived SSH private key sits in GitHub secrets. The two things a hosted
# runner would have required are exactly the two worth not having.
#
# ⚠ THE REPOSITORY MUST STAY PRIVATE. A self-hosted runner on a public repo
#   executes code from fork pull requests on your server. This workflow never
#   triggers on `pull_request` for that reason, but the repository setting is
#   the control that actually matters.
#
# ⚠ Anyone who can push to `main` can run commands on the server as a user in
#   the docker group, which is root-equivalent. Branch protection on `main` is
#   what keeps that list to the people you intend.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to deploy. Empty deploys the branch you dispatch from, which is also the branch the tests above ran against."
        required: false
        default: ""

# Never two deploys at once, and never cancel one midway: a cancelled job
# between `git checkout` and `docker compose up` leaves the host on code that
# no commit describes.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Images first, because everything downstream resolves through the digest
  # lock: the suite pulls what a manifest declares, and the host refuses to
  # start on an unpinned tag. Skips itself unless a Dockerfile changed or the
  # lock is stale, so most deploys pay nothing for this step.
  #
  # It may add a lock commit, which is why it reports a SHA back.
  images:
    uses: ./.github/workflows/images.yml
    permissions:
      contents: write
    secrets: inherit

  # The full suite, including the snippy-fasta end-to-end run. Slow, and the
  # right thing to be slow about.
  test:
    needs: images
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: [images, test]
    runs-on: [self-hosted, dharini]
    timeout-minutes: 45

    env:
      APP_DIR: /srv/dharini/app
      # The images job's SHA, not github.sha: if it refreshed the lock, that
      # commit is the only one whose images.lock.json matches the manifests,
      # and deploying the commit before it resolves images by mutable tag --
      # which REQUIRE_PINNED_IMAGES refuses, failing the deploy on the host.
      TARGET: ${{ github.event.inputs.ref || needs.images.outputs.sha || github.sha }}

    steps:
      # No actions/checkout. The deploy directory is /srv/dharini/app -- it
      # holds .env, which is not in git and must not be replaced -- so the
      # runner's own workspace is irrelevant here.
      - name: Record what is running now, for rollback
        id: current
        run: |
          cd "$APP_DIR"

          # A tracked file edited in place on the box makes `git checkout`
          # refuse, which would fail the deploy AND the rollback -- both are a
          # checkout -- leaving the host mid-deploy. Fail here instead, while
          # nothing has moved, and say what to do about it.
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::$APP_DIR has uncommitted changes to tracked files."
            git status --short --untracked-files=no
            echo "Commit them, or discard with: git -C $APP_DIR checkout -- ."
            exit 1
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "lock=$(git hash-object images.lock.json)" >> "$GITHUB_OUTPUT"
          echo "Currently deployed: $(git rev-parse --short HEAD)"

      - name: Fetch and check out the target
        run: |
          cd "$APP_DIR"
          git fetch --prune origin
          # Resolve through origin/ first. `git checkout main` on a host that
          # has fetched but never merged checks out the LOCAL main, which is
          # whatever it was when the box was first cloned -- a deploy that
          # reports success and changes nothing.
          if git rev-parse --verify --quiet "origin/$TARGET^{commit}" >/dev/null; then
            sha=$(git rev-parse "origin/$TARGET^{commit}")
          else
            sha=$(git rev-parse --verify "$TARGET^{commit}")
          fi
          git checkout --detach "$sha"
          echo "Deploying: $(git rev-parse --short HEAD) $(git log -1 --format=%s)"

      # Digests are pinned, so a new image reaches the host only when pulled.
      # Skipped when the lock file did not move, which is most deploys.
      - name: Pull tool images if the digest lock changed
        run: |
          cd "$APP_DIR"
          if [ "$(git hash-object images.lock.json)" != "${{ steps.current.outputs.lock }}" ]; then
            echo "images.lock.json changed -- pulling"
            make images-pull
          else
            echo "images.lock.json unchanged -- skipping the ~9 GB pull"
          fi

      - name: Rebuild and restart
        run: |
          cd "$APP_DIR"
          docker compose up -d --build
          docker compose ps

      # init_db() runs `alembic upgrade head` in the API's lifespan handler, so
      # the schema moves during startup and a green health check means the
      # migration landed too.
      - name: Wait for health
        id: health
        run: |
          for attempt in $(seq 1 30); do
            if body=$(curl -fsS --max-time 5 localhost:8000/health 2>/dev/null); then
              echo "$body" | jq .
              ok=$(echo "$body" | jq -r '.status')
              reachable=$(echo "$body" | jq -r '.storage.reachable')
              revision=$(echo "$body" | jq -r '.schema_revision')
              if [ "$ok" = "ok" ] && [ "$reachable" = "true" ] && [ "$revision" != "null" ]; then
                echo "healthy after ${attempt}0s"
                exit 0
              fi
              echo "up but not ready: status=$ok reachable=$reachable revision=$revision"
            fi
            sleep 10
          done
          echo "::error::health did not go green within 300s"
          exit 1

      # Restores the CODE. It does not undo a migration -- alembic upgrades are
      # forward-only here -- so a failed deploy that already migrated needs a
      # manual `make migrate` decision. Said out loud because a rollback that
      # quietly leaves the schema ahead of the code is worse than no rollback.
      - name: Roll back on failure
        if: failure() && steps.current.outputs.sha != ''
        run: |
          cd "$APP_DIR"
          echo "::warning::deploy failed -- restoring ${{ steps.current.outputs.sha }}"
          git checkout --detach "${{ steps.current.outputs.sha }}"
          docker compose up -d --build
          for attempt in $(seq 1 18); do
            if curl -fsS --max-time 5 localhost:8000/health >/dev/null 2>&1; then
              echo "rolled back and healthy"
              echo "::warning::SCHEMA WAS NOT ROLLED BACK. If this deploy ran a migration, check GET /health schema_revision against the restored code."
              exit 0
            fi
            sleep 10
          done
          echo "::error::rollback did not come up either -- the host needs a human"
          exit 1

      - name: Summary
        if: always()
        run: |
          cd "$APP_DIR"
          {
            echo "### Deploy"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Commit | \`$(git rev-parse --short HEAD)\` $(git log -1 --format=%s) |"
            echo "| Result | ${{ job.status }} |"
            echo "| Schema | $(curl -fsS --max-time 5 localhost:8000/health 2>/dev/null | jq -r '.schema_revision // "unreachable"') |"
          } >> "$GITHUB_STEP_SUMMARY"
